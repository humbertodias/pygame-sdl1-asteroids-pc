name: linux ubuntu build

on:
  push

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.15 free-threading
        uses: actions/setup-python@v5
        with:
          python-version: "3.15t"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            clang \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libfreetype6-dev \
            libportmidi-dev

      - name: Get Information Variables
        id: core
        run: |
          echo "platform=$(uname -m)" >> $GITHUB_OUTPUT
          echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Run build
        run: |
          make dep exe
          mkdir -p ${{ github.workspace }}/artifact
          mv main.dist ${{ github.workspace }}/artifact/asteroids-linux-${{ steps.core.outputs.platform }}-${{ steps.core.outputs.sha8 }}
          
      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: asteroids-linux-${{ steps.core.outputs.platform }}-${{ steps.core.outputs.sha8 }}
          path: ${{ github.workspace }}/artifact/**/*